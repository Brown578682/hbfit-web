name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "18"
  AWS_REGION: us-east-1   # Change to match your App Runner region

jobs:
  build-and-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Generate Prisma client ──────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── 5. Build Next.js app ───────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      # ── 6. Configure AWS credentials ───────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 7. Deploy to App Runner ────────────────────────────────────────────
      - name: Deploy to AWS App Runner
        uses: aws-actions/amazon-apprunner-deploy@v1
        with:
          service: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          # App Runner will pull & rebuild from the source repository
          # (source-based deployment — no image build needed here)
          wait-for-service-stability-seconds: 300

      # ── 8. Run database migrations ─────────────────────────────────────────
      # NOTE: This step requires a VPC-connected runner or a bastion approach.
      # Uncomment and adapt once your runner has VPC access to the RDS instance.
      # - name: Run database migrations
      #   run: npx prisma migrate deploy
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
